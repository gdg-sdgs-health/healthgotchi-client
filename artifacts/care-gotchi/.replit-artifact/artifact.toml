kind = "web"
previewPath = "/"
title = "Care-Gotchi"
version = "1.0.0"
id = "artifacts/care-gotchi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21091

[services.development]
run = "pnpm --filter @workspace/care-gotchi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/care-gotchi", "run", "build" ]
publicDir = "artifacts/care-gotchi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21091"
BASE_PATH = "/"
